name: Tests (offline)
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install OCR tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-hin fonts-freefont-ttf >/dev/null
          pip install -q numpy pypdfium2 pillow
      - run: python tests/test_offline.py
      - name: मराठी भाषा-फाइल आपोआप उतरते का
        run: |
          python - <<'PY'
          import pdf_ocr, subprocess
          t = pdf_ocr.find_tesseract()
          d = pdf_ocr.ensure_lang(t, "mar")
          out = subprocess.run([t, "--list-langs", "--tessdata-dir", d], capture_output=True, text=True).stdout
          print(out); assert "mar" in out
          PY
      - name: tiny GPT gradient check
        working-directory: tiny_ai
        run: python tiny_gpt.py check
