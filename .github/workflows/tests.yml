name: Tests (offline)
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tests/test_offline.py
      - name: tiny GPT gradient check
        working-directory: tiny_ai
        run: pip install numpy && python tiny_gpt.py check
