name: Padaccheda probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { py: ["3.12", "3.9"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.py }}" }
      - run: pip install sanskrit_parser 2>&1 | tail -2; pip list 2>/dev/null | grep -iE "sanskrit|indic|sqlalchemy|networkx|gensim|numpy"
      - run: python scripts/padaccheda_probe.py
      - run: du -sh ~/.sanskrit_parser 2>/dev/null; ls -la ~/.sanskrit_parser 2>/dev/null | head
